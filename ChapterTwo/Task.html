<!DOCTYPE html>
<html>
    <head>
        <title>User Registration form</title>
    </head>
    <body>
        <h1>Registration form</h1>
        <form>
            <main>
            <fieldset>
            <lagend>
                Personal information
            </lagend><br>
            <label>Enter your Name: </label>
            <input type="text" name="name" id="id" required />&nbsp;&nbsp;<br>
            <label> Enter your Mobile no: </label>
            <input type="number" pattern="0-9"[10] name="name" id="id" required/>&nbsp;&nbsp;<br>
            <label>Enter your Email: </label>
            <input type="email" name="email" id="id" required/>&nbsp;&nbsp;<br>
            <label>Password:</label>
            <input type="password" name="password" id="id" required />
            <input type="hidden" name="hidden" />
            <label>Gender:</label>
            <label>male</label>
            <input type="radio" name="male"  />
            <label>female</label>
            <input type="radio" name="female" />
            <label>Age:</label>
            <input type="number" name="age" id="id" />

            </main>
            <footer>
            <input type="button" name="Cancel">
            <input type="reset" name="Reset">
            <input type="submit" name="Submit">
            </footer>
            </fieldset>
        </form>
    </body>
</html>
