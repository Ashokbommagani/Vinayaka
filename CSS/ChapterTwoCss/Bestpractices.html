<!DOCTYPE html>
<html>
    <head>
        <title>Best practices for css</title>
        <style>
            /* headers */
            header
            {
             h1
             {
            color: blueviolet;

             }
            }
            /* Navigation */
            nav
            {
                <link rel="stylesheet" href="external.css">
            }
            /* footer */
            footer
            {
                color: green;
            }
            primary-button
            {
                background-color: antiquewhite;
                color: yellow;
            }
            .btn
            {
                color: aqua;
            }
            :root
            {
                --primary:#0099ff;
                body
                {
                    background:var(--primary);

                }
            }

        </style>
     </head>
     <body>
        <h1>welcome</h1>
        <button value="ok"></button>
        <footer>terms and conditions apply copyright&2026</footer>
     </body>
</html>
