<!DOCTYPE html>
<html>
<head>
    <title>CSS Best Practices Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="beststyle.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1 class="website-title">My Website</h1>
        <p class="website-description">
            Learning HTML and CSS
        </p>
    </header>

    <!-- Main Content -->
    <main>
        <h2 class="section-title">Welcome</h2>

        <p class="content-text">
            This is an example of using External CSS.
        </p>

        <!-- Reusable buttons -->
        <button class="primary-button">Login</button>
        <button class="primary-button">Register</button>
    </main>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2026 My Website</p>
    </footer>

</body>
</html>
